name: checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Python syntax
        run: uv run --locked python -m py_compile update_calendar.py

      - name: Unit tests
        run: uv run --locked pytest -v

      - name: Shell script checks
        run: |
          bash -n deploy.sh
          shellcheck -S warning deploy.sh

      - name: JavaScript syntax check
        run: |
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/page.js
          node --check /tmp/page.js
