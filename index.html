<!DOCTYPE html>
<html>
<head>
    <title>Laser Booking Calendar</title>
    <meta charset="utf-8">
    <style>
      * { cursor: none !important; }
      html, body { margin:0; height:100%; font-family:sans-serif; overflow:hidden; }
      body { display:flex; flex-direction:column; background:#3a3f44; }
      .banner { display:flex; align-items:center; justify-content:center; text-align:center;
                font-weight:bold; color:white; background:gray; }
      #top    { height:25%;   font-size:6vw; }
      #bottom { height:12.5%; font-size:3vw; background:#2b2f33; }
      #top.free   { background:#1e9e3e; }
      #top.booked { background:#f57c00; }

      #cal { flex:1; overflow:hidden; padding:16px 24px; color:#f0f0f0; }
      .day { font-size:2vw; font-weight:600; color:#b8c0c6; margin:14px 0 6px;
             text-transform:uppercase; letter-spacing:.08em; }
      .ev  { display:flex; gap:24px; align-items:baseline; font-size:2.4vw;
             padding:10px 18px; margin:6px 0; border-radius:12px; background:#4b5157;
             border-left:8px solid #8a949c; }
      .ev.now { background:#6b4a2a; border-left-color:#f57c00; }
      .ev .t  { font-variant-numeric:tabular-nums; min-width:11ch; color:#d0d6da; }
      .ev.now .t { color:#ffcc80; }
      .empty { font-size:2.4vw; color:#a3acb3; padding-top:20px; }
    </style>
</head>
    <body>
        <div id="top" class="banner">LOADING…</div>
        <div id="cal"></div>
        <div id="bottom" class="banner">&nbsp;</div>

        <script>
        const pad = n => String(n).padStart(2, "0");
        const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        const MAX_EVENTS_ON_SCREEN = 8;

        function renderCal(events) {
          const el = document.getElementById("cal");
          const now = new Date();
          let html = "", lastDay = "";
          for (const ev of events.slice(0, MAX_EVENTS_ON_SCREEN)) {
            const a = new Date(ev.start), b = new Date(ev.end);
            const day = a.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"short" });
            if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
            const cur = a <= now && now < b ? " now" : "";
            html += `<div class="ev${cur}"><span class="t">${hhmm(a)} – ${hhmm(b)}</span><span>${esc(ev.title)}</span></div>`;
          }
          el.innerHTML = html || '<div class="empty">No bookings in the next 30 days</div>';
        }

        async function update() {
          const top = document.getElementById("top");
          const bottom = document.getElementById("bottom");
          try {
            const s = await (await fetch("status.json", { cache: "no-store" })).json();
            if (s.error) throw new Error(s.error);

            // Treat data older than 5 minutes as stale (e.g. cron stopped)
            if (Date.now() - new Date(s.updated) > 5 * 60 * 1000) throw new Error("stale");

            renderCal(s.events || []);

            if (s.booked) {
              top.textContent = `LASER IS BOOKED UNTIL ${s.until}`;
              top.className = "banner booked";
            } else {
              top.textContent = "LASER IS FREE";
              top.className = "banner free";
            }

            if (s.next_start) {
              const a = new Date(s.next_start), b = new Date(s.next_end);
              const date = a.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
              bottom.textContent = `Next booking is on ${date} ${hhmm(a)} to ${hhmm(b)}`;
            } else {
              bottom.textContent = "No upcoming bookings";
            }
          } catch (err) {
            top.textContent = "STATUS UNAVAILABLE";
            top.className = "banner";
            bottom.textContent = "Check calendar updater: " + err.message;
          }
        }
        update();
        setInterval(update, 30000);
        </script>
    </body>
</html>
